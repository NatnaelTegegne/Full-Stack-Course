<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Password Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main-container">
        <div class="upper-section">
            <h1>Generate a<br><span>random password</span></h1>
            <h5>Never use an insecure password again.</h5>
            <form>
                <label for="length-input" style="font-size: large; margin-bottom: 10px; font-weight: bold;">Enter password length (max 15):</label>
                <input type="text" id="length-input" style="width: 150px; height: 30px;"><br>
                <input type="submit" value="Generate" onclick="generate(event)" id="generate-btn" style="font-size: large; font-weight: bold;"> 
            </form>
            <h6 id="notice" style="margin-top: 30px;"></h6>
        </div>
        <div class="lower-section">
            
            <button id="password-one" onclick="copy()"></button>
            <button id="password-two" onclick="copy()"></button>
        </div>
    </div> 
    <script src="./index.js"></script>
</body>
</html>
